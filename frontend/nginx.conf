server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header X-API-Key ${API_KEY};
    }

    location /health {
        proxy_pass http://app:8000/health;
        proxy_http_version 1.1;
        proxy_set_header X-API-Key ${API_KEY};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
