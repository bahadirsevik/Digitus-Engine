server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uygulama CSV importuna 10 MB izin verir (CSV_IMPORT_MAX_BYTES);
    # nginx varsayilani 1 MB'ta 413 dondururdu.
    client_max_body_size 12m;
    # Senkron AI uclari (tekil SEO+GEO, sosyal kategori/fikir/icerik,
    # URL'den keyword fikri) 60 sn varsayilanini asabilir.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /api/ {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header X-API-Key ${API_KEY};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect http:// https://;   
    }

    location /health {
        proxy_pass http://app:8000/health;
        proxy_http_version 1.1;
        proxy_set_header X-API-Key ${API_KEY};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
