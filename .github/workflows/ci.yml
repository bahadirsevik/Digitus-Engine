name: CI

# Test + lint only. No deploy steps, no secrets, no paid AI calls
# (GEMINI_API_KEY is empty in docker-compose.test.yml).
on:
  push:
    branches: [deploy/lean-taslak]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Isolated test_db from docker-compose.test.yml; no .env is created
      # (APP_ENV=test makes app/config.py ignore env files).
      - name: Run backend tests (isolated test DB)
        run: >
          docker compose -f docker-compose.test.yml run --rm test_app
          sh -c "alembic upgrade head && pytest tests/ -q -p no:warnings"
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
